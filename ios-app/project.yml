name: SlideClicker
options:
  bundleIdPrefix: com.idobachar
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6R6WU3R8XA
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # iPhone app (App Store). The personal build adds the "also when locked" mode:
  #   install-iphone.sh passes PERSONAL_BUILD + Personal/Info.plist.
  SlideClicker:
    type: application
    platform: iOS
    sources:
      - path: SlideClicker
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idobachar.slideclicker
        PRODUCT_NAME: SlideClicker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: SlideClicker/Info.plist
      properties:
        CFBundleDisplayName: "קליקר"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: "האפליקציה צריכה גישה לרשת המקומית כדי למצוא את המק ולשלוח לו פקודות מעבר שקופית."
        NSBonjourServices: ["_slideclicker._tcp"]
        CFBundleDevelopmentRegion: he
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false

  # Mac companion app (menu bar). Distributed outside the Mac App Store:
  # Developer ID signed + notarized, because it posts key events to other apps.
  MacClicker:
    type: application
    platform: macOS
    sources:
      - path: MacClicker
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idobachar.slideclicker.mac
        PRODUCT_NAME: "Clicker"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MacClicker/MacClicker.entitlements
        ENABLE_PREVIEWS: YES
    info:
      path: MacClicker/Info.plist
      properties:
        CFBundleDisplayName: "קליקר"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: he
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSLocalNetworkUsageDescription: "קליקר מקבל חיבורים מהאייפון ברשת המקומית כדי להעביר שקופיות."
        NSBonjourServices: ["_slideclicker._tcp"]
        NSHumanReadableCopyright: "© 2026 Ido Bachar"
